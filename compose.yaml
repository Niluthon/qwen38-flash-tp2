# The tp2-hotcold engine (2x Arc Pro B70, ~64 GB RAM) with Docker Compose. Step-by-step guide: HOW-TO-RUN.md.
#
#   docker compose build                # build the image (downloads the base image, kernels and shim; ~20 GB)
#   docker compose run --rm prepare     # once: download and prepare the weights (~185 GB on $MODELS)
#   docker compose up -d                # start; the warm-up service sends one short request once the engine is healthy
#   docker compose logs -f engine       # follow the log (also written to engine-data/engine.log)
#   docker compose down                 # stop
#
# Tuning, without editing tracked files:
#   * environment (B70_* switches, hot experts, PLE cache, ...): copy engines/two-cards/env/tp2-local.env.example to
#     engines/two-cards/env/tp2-local.env and set what you want to change; it overrides engines/two-cards/env/tp2-hotcold.env (the defaults).
#     `docker compose up -d` again to apply (the engine restarts).
#   * vllm serve flags: EXTRA_ARGS in engines/two-cards/env/tp2-local.env (appended to engines/two-cards/args/serve-tp2.args; the last value of a
#     flag wins), e.g. EXTRA_ARGS=--max-model-len 65536 --gpu-memory-utilization 0.92
#   * host paths and image: MODELS, ENGINE_DATA, IMAGE in a .env file next to this one (see .env.example).
#   * the CPU path for cold experts: B70_MOE_CPU=0 (off) or 1 (on, the default) in .env or the shell.
#   * another environment file: ENGINE_ENV / ENGINE_LOCAL_ENV in .env (default: the two files above).
#
# Image: image/Dockerfile.tp2 (vLLM of release 0.30.0-b70.2 = Lumnus/vllm@v0.30.0-b70.2, the two-card patches
# 0040-0049, kernels 0.1.14.1+b70.3, the residency shim; on the official vLLM v0.30.0 XPU image).
# docs/two-cards.md has the details and the measurements.

name: b70-flash-next

# image and build definition, shared by the services that need the engine's vLLM (does not pull in devices, env or
# the engine's volumes: the warm-up service is happy with network, the args file and a python)
x-image: &image
  image: ${IMAGE:-b70-flash-next:tp2}
  build:
    context: .
    dockerfile: image/Dockerfile.tp2

x-engine-base: &engine-base
  <<: *image
  network_mode: host
  working_dir: /opt/venv
  volumes:
    - ./engines:/b70-engines:ro
    - ${ENGINE_DATA:-${WORK:-./engine-data}}:/work

services:
  engine:
    <<: *engine-base
    container_name: b70-tp2
    devices:
      - /dev/dri:/dev/dri
    group_add: [render, video]
    ipc: host
    shm_size: 16g
    ulimits:
      memlock: -1
    env_file:
      - path: ${ENGINE_ENV:-engines/two-cards/env/tp2-hotcold.env}
      - path: ${ENGINE_LOCAL_ENV:-engines/two-cards/env/tp2-local.env}
        required: false
    volumes:
      - ./engines:/b70-engines:ro
      - ${ENGINE_DATA:-${WORK:-./engine-data}}:/work
      - ${MODELS:-${HOME}/models}:/models:ro
      - /dev/dri/by-path:/dev/dri/by-path:ro   # oneCCL opens it; --device /dev/dri does not create it
    environment:
      # B70_MOE_CPU from the root .env or the shell (e.g. `B70_MOE_CPU=0 docker compose up -d`): the CPU path for cold
      # experts (0049) on (1) or off (0); empty = what the env files say. Applied by compose-serve.sh.
      B70_MOE_CPU_FROM_HOST: ${B70_MOE_CPU:-}
    entrypoint: ["/bin/bash", "/b70-engines/two-cards/scripts/compose-serve.sh", "serve"]
    healthcheck:
      test: ["CMD", "/bin/bash", "/b70-engines/two-cards/scripts/compose-serve.sh", "health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15m   # weight loading + graph capture take ~4-5 min
    stop_grace_period: 90s
    restart: "unless-stopped"         # start by hand after a crash or reboot (`docker compose up -d`)

  # Known issue 13: with MTP, the first request after start must be short. This runs one, then exits.
  # A service of its own: no depends_on and nothing of the engine's runtime (no devices, no /work, no residency shim),
  # so `up -d` and `restart engine warmup` never race the engine — the request waits for /health and retries itself
  # (compose-serve.sh warmup, WARMUP_TIMEOUT seconds, 1200 by default). The env files are read for the serve flags only
  # (port, served-model-name) and EXTRA_ARGS.
  warmup:
    <<: *image
    network_mode: host
    working_dir: /opt/venv
    volumes:
      - ./engines:/b70-engines:ro
    env_file:
      - path: ${ENGINE_ENV:-engines/two-cards/env/tp2-hotcold.env}
      - path: ${ENGINE_LOCAL_ENV:-engines/two-cards/env/tp2-local.env}
        required: false
    environment:
      LD_PRELOAD: ""   # the residency shim needs the GPUs; this container only sends an HTTP request
      # seconds it waits for the engine before exiting 1 (from the shell or .env: `WARMUP_TIMEOUT=3600 docker compose up -d warmup`)
      WARMUP_TIMEOUT: ${WARMUP_TIMEOUT:-1200}
    entrypoint: ["/bin/bash", "/b70-engines/two-cards/scripts/compose-serve.sh", "warmup"]
    restart: "no"

  # One-time setup, not started by `up`: `docker compose run --rm prepare` downloads the checkpoint and makes the
  # serve snapshots on $MODELS (scripts/prepare-models-tp2.sh; skips what is already there). BUILD_INT8_PLE=1 also
  # builds the INT8 PLE table, only needed for the INT8 fallback (the engine reads the FP8 shards in place, 0050).
  prepare:
    <<: *engine-base
    profiles: [setup]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      REVISION: ${REVISION:-}
      SKIP_DOWNLOAD: ${SKIP_DOWNLOAD:-0}
      BUILD_INT8_PLE: ${BUILD_INT8_PLE:-0}
    volumes:
      - ./engines:/b70-engines:ro
      - ./tools:/b70-tools:ro
      - ./scripts:/b70-scripts:ro
      - ${ENGINE_DATA:-${WORK:-./engine-data}}:/work
      - ${MODELS:-${HOME}/models}:/models
    entrypoint: ["/bin/bash", "/b70-scripts/prepare-models-tp2.sh"]
    restart: "no"
